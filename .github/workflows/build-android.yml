name: Build Android (OSS debug)

on:
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5

      # 项目 gradle-daemon-jvm.properties 固定要求 JDK 21（JBR 发行版）。
      # CI 用 temurin 21 即可满足 Gradle daemon 的版本校验，无需再删该文件。
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 镜像已预装 Android SDK（含本项目所需的 API 36 平台 / build-tools），
      # 无需再单独安装，省掉一次网络下载。

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build OSS debug APK
        run: ./gradlew :app:assembleOssDebug -POAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-debug
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
