name: Sync upstream and release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "强制编译一次（忽略是否有新提交）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.merge.outputs.has_changes }}
      has_conflict: ${{ steps.merge.outputs.has_conflict }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chen2he/orange-cloud.git
          git fetch upstream
          BEFORE=$(git rev-parse HEAD)
          if ! git merge upstream/main --no-edit; then
            git merge --abort
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
            echo "::error::合并 upstream/main 时出现冲突，已自动放弃合并（git merge --abort）。需要手动解决后再推送。"
            exit 0
          fi
          AFTER=$(git rev-parse HEAD)
          echo "has_conflict=false" >> "$GITHUB_OUTPUT"
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin HEAD:main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || inputs.force_build == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # 项目 gradle-daemon-jvm.properties 固定要求 JDK 21（JBR 发行版）。
      # CI 用 temurin 21 即可满足 Gradle daemon 的版本校验，无需再删该文件。
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 镜像已预装 Android SDK（含本项目所需的 API 36 平台 / build-tools），
      # 无需再单独安装。

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build OSS release APK
        run: ./gradlew :app:assembleOssRelease -POAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}

      - name: Read version from build.gradle.kts
        id: version
        run: |
          BASE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            echo "Could not find versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          # oss flavor 有 versionNameSuffix（如 "-oss"），拼到 base 版本号后面，
          # 与实际打出来的 APK 版本号保持一致
          OSS_SUFFIX=$(awk '/create\("oss"\)/,/^\s*}/' app/build.gradle.kts \
            | grep -oP 'versionNameSuffix\s*=\s*"\K[^"]+' | head -n1)
          echo "name=${BASE_VERSION}${OSS_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Compute tag
        id: tag
        run: echo "tag=oss-v${{ steps.version.outputs.name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OSS build v${{ steps.version.outputs.name }}
          files: apps/android/app/build/outputs/apk/oss/release/*.apk
          body: |
            自动同步自 chen2he/orange-cloud 上游更新，OSS 风味 release 签名构建。
            版本: ${{ steps.version.outputs.name }}
            Commit: ${{ github.sha }}

  notify-conflict:
    needs: sync
    if: needs.sync.outputs.has_conflict == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize conflict
        run: |
          echo "### ⚠️ 与上游合并出现冲突" >> "$GITHUB_STEP_SUMMARY"
          echo "本次定时同步未能自动合并 upstream/main，已放弃合并，fork 的 main 分支未被改动。" >> "$GITHUB_STEP_SUMMARY"
          echo "需要手动 clone 仓库、fetch upstream、执行 \`git merge upstream/main\` 解决冲突后推送。" >> "$GITHUB_STEP_SUMMARY"
